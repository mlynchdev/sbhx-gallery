[project]
name = "photo-share"
version = "0.1.0"
description = "SBHX member gallery of machined parts"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "authlib>=1.3",
    "requests>=2.31",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
